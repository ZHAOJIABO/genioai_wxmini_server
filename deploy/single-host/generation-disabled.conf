# Clear only after AI Brain deployment and controlled generation verification.
location ~ ^/v1/pictureforge/(submit_picture_forge_task|retry_failed_task|submit_random_workflow_task|submit_picture_tools_task|submit_picture_task_chain)/?$ {
    default_type application/json;
    add_header Retry-After 3600 always;
    return 503 '{"code":14,"message":"Image generation is not available yet"}';
}
