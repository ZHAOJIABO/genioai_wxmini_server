name: genio

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  mysql:
    <<: *common
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run prepare.py first}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Run prepare.py first}
      BRAIN_DB_PASSWORD: ${BRAIN_DB_PASSWORD:?Run prepare.py first}
    command: ["--innodb-buffer-pool-size=134217728", "--max-connections=80", "--performance-schema=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/01-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend-redis:
    <<: *common
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: ["backend-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  brain-redis:
    <<: *common
    profiles: ["ai"]
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: ["brain-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai-brain:
    <<: *common
    profiles: ["ai"]
    image: genio-ai-brain:${RELEASE_TAG:?Set RELEASE_TAG}
    init: true
    stop_grace_period: 60s
    env_file: ./private/ai-brain.env
    environment:
      ENV: PROD
      SERVER_NAME: ai-brain
      MYSQL_DSN: "brain:${BRAIN_DB_PASSWORD}@tcp(mysql:3306)/ai_brain?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: brain-redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "5"
      TASK_WORKER_COUNT: "1"
      QUEUE_TYPE: redis
      GOMEMLIMIT: 300MiB
      GOMAXPROCS: "2"
      LOG_PATH: /application/logs/ai-brain.log
      LOG_MAX_SIZE: "10"
      LOG_MAX_BACKUPS: "3"
    command: ["-port", "8080", "-config", "/application/configs/providers.yaml"]
    volumes:
      - ./private/providers.yaml:/application/configs/providers.yaml:ro
      - brain-logs:/application/logs
    depends_on:
      mysql: {condition: service_healthy}
      brain-redis: {condition: service_healthy}

  backend:
    <<: *common
    build:
      context: ../..
      dockerfile: deploy/single-host/backend.Dockerfile
    image: genio-backend:${RELEASE_TAG:?Set RELEASE_TAG}
    init: true
    stop_grace_period: 60s
    environment:
      GOMEMLIMIT: 300MiB
      GOMAXPROCS: "2"
    command: ["-c", "/application/conf/server.yaml"]
    ports: ["127.0.0.1:8200:8200"]
    volumes:
      - ./private/server.yaml:/application/conf/server.yaml:ro
      - backend-logs:/application/log
    depends_on:
      mysql: {condition: service_healthy}
      backend-redis: {condition: service_healthy}

  nginx:
    <<: *common
    image: nginx:1.28-alpine
    profiles: ["https"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./generation-disabled.conf:/etc/nginx/generation-disabled.conf:ro
      - ./private/tls:/etc/nginx/tls:ro
    depends_on: [backend]

volumes:
  mysql-data:
  backend-redis-data:
  brain-redis-data:
  backend-logs:
  brain-logs:
