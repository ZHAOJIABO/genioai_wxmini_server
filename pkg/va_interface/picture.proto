syntax = "proto3";
package va_interface;

import "common.proto";
import "constants.proto";

option go_package = "va_visionai_server/internal/va_interface";

message WorkflowInput {
  // 参数名称
  string input_name = 1;
  // 输入类型
  MessageType input_type = 2;
  // 输入内容（图片URL）
  string input_content = 3;
}

message WorkflowExampleImage {
  // 原始图片
  repeated string ori_content = 1;
  // 原始图片数量
  int32 ori_content_count = 2;
  // 输出图片
  string result_content = 3;
  // 图片高宽比
  float aspect_ratio = 4;
  // 输出样例（视频、图片）的缩略图
  string result_thumbnail_url = 5;
}

message Workflow {
  // workflow ID 问答时设置workflow id 可启用对应的workflow
  string workflow_id = 1;
  // 标题
  string title = 2;
  // 描述
  string description = 3;
  // 标识
  string kind_id = 4;
  // icon
  string icon = 5;
  // 使用此workflow需要的参数，如果长度为1表示需要1个输入。
  repeated WorkflowInput inputs = 6;
  // 示例图片
  WorkflowExampleImage example_image = 7;
  // 人脸数量
  int32 face_count = 8;
  // 工作流类型
  WorkflowKindType kind_type = 9;
  // 工作流生成主题(@deprecated)
  WorkflowTheme theme = 10;
  // 是否免费
  bool is_free = 11;
  // 是否热门
  bool is_hot = 12;
  // 是否新上模板
  bool is_new = 13;
  // workflow theme string类型
  string workflow_theme = 14;
  // 积分消耗
  int32 credit_cost = 15;
  // 任务链积分消耗 计算整个任务链每个模板的积分消耗总和
  int32 chain_credit_cost = 16;
  // 支持的额外参数
  repeated ToolParamDetail support_extra_params = 17;
  // 二创prompt（用于图生视频的二创prompt）
  string recreate_prompt = 18;
}

message WorkflowKind {
  // workflow标识
  string kind_id = 1;
  // 显示文本
  string label = 2;
  // 工作流类型 图片，视频
  WorkflowKindType kind_type = 3;
  // 工作流生成主题 人物，宠物
  WorkflowTheme theme = 4;
  // 工作流列表
  repeated Workflow workflows = 5;
  // 类型的封面图
  repeated PictureInfo cover_pictures = 6;
  // 分类描述
  string description = 7;
  // 分类展示样式
  WorkflowKindDisplayStyle display_style = 8;
}

message PictureForgeInfo {
  // userID
  string user_id = 1;
  // 任务ID
  string task_id = 2;
  // 任务状态
  WorkflowTaskStatus task_status = 3;
  // 任务进度 0-100
  int32 task_progress = 4;
  // 任务结果(图片信息)
  PictureInfo task_result_picture_info = 5;
  // 用户选择展示的图片信息
  PictureInfo user_show_picture_info = 6;
  // 用户图片信息(输入参数)
  repeated PictureInfo user_picture_info = 7;
  // 评分
  repeated PicScoreInfo score = 8;
  // 发布状态
  PublishStatus publish_status = 9;
  // workflow 引用的workflow信息
  Workflow workflow = 10;
  // 浏览量
  string view_count = 11;
  // 是否未读取任务结果
  bool unread_task_result = 12;
  // 允许展示原始图片
  bool allow_show_ori_picture = 13;
  // 工作流类型
  WorkflowKindType kind_type = 14;
  // 工作流生成主题
  WorkflowTheme theme = 15;
  // 是否免费
  bool is_free = 16;
  // workflow theme string类型
  string workflow_theme = 17;
  // 任务完成时间（秒级时间戳）
  int64 task_complete_time = 18;
  // 能否重试
  bool can_retry = 19;
  // tag
  repeated string tags = 20;
  // 任务失败原因标题
  string task_fail_reason = 21;
  // 任务失败原因详情
  string task_fail_reason_full = 22;
  // 使用的工具ID
  string tool_id = 23;
  // 使用的prompt
  string prompt = 24;
  // 默认可使用的图片转视频工具ID
  string default_picture_to_video_tool_id = 25;
  // 二创prompt（用于图生视频的二创prompt）
  string recreate_prompt = 26;
  // 是否为模型直连模式
  bool is_model_direct = 27;
  // 模型名称（仅模型直连模式有值）
  string model_name = 28;
  // 负面prompt（仅模型直连模式有值）
  string negative_prompt = 29;
  // 图片生成类型（文生图/图生图）
  ImageGenerationType generation_type = 30;
  // 任务消耗的积分
  int32 credit_cost = 31;
  // 多图结果列表（单图时为空或仅1个元素）
  repeated PictureInfo task_result_pictures = 32;
}

message PicScoreInfo {
  // 维度名称
  string name = 1;
  // 维度值
  string value = 2;
}

// 模型配置（用于直接调用模型）
message ModelConfig {
  // 模型名称（如：flux-dev, sd3, wanx, kling等）
  string model_name = 1;
  // 生成图片数量（可选，默认1）
  int32 num_images = 2;
  // 推理步数（可选，使用模型默认值）
  int32 steps = 3;
  // CFG scale（可选，使用模型默认值）
  float cfg_scale = 4;
  // 种子（可选，-1表示随机）
  int64 seed = 5;
  // 宽度（可选，使用模型默认值）
  int32 width = 6;
  // 高度（可选，使用模型默认值）
  int32 height = 7;
  // 图片质量（可选，如：standard, hd, ultra等，具体取值由模型决定）
  string quality = 8;
  // 图片宽高比（可选，如：16:9, 1:1, 4:3, 3:2等，具体取值由模型决定）
  string aspect_ratio = 9;
}

// 提交图片生成任务请求
message SubmitPictureForgeTaskRequest {
  RequestHeader request_header = 1;

  // ===== Workflow模式字段（与模型直连模式二选一） =====
  // 工作流ID（workflow模式必填，model_config存在时可不填）
  string workflow_id = 2;
  // 工作流参数
  repeated WorkflowInput workflow_input = 3;
  // 工作流主题
  string workflow_theme = 4;
  // 时长
  string duration = 5;
  // 分辨率
  string resolution = 6;

  // ===== 模型直连模式字段（与workflow模式二选一） =====
  // 模型配置（如果设置了model_config，则忽略workflow_id）
  ModelConfig model_config = 7;
  // 用户输入的prompt（模型直连模式必填）
  string user_prompt = 8;
  // 负面prompt（可选，用于指定不想要的内容）
  string negative_prompt = 9;
  // 用户上传的图片URL列表（图生图模式使用，支持多图）
  repeated string user_images = 10;
  // 图生图强度（0.0-1.0，默认0.75，仅图生图时生效）
  float strength = 11;
}

// 提交图片生成任务响应
message SubmitPictureForgeTaskResponse {
  ResponseHeader response_header = 1;
  // 任务ID
  string task_id = 2;
}

// 获取图片生成任务结果请求
message GetPictureForgeTaskResultRequest {
  RequestHeader request_header = 1;
  // 任务ID
  string task_id = 2;
}

// 获取图片生成任务结果响应
message GetPictureForgeTaskResultResponse {
  ResponseHeader response_header = 1;
  PictureForgeInfo picture_forge_info = 2;
}

