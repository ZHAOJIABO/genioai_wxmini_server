      body: "*"
    };
  }
}
service TTSService {
  rpc GetMsgAudio(TTSRequest) returns (stream TTSStreamResponse) {
    option (google.api.http) = {
      post: "/v1/tts/get_msg_audio"
      body: "*"
    };
  }
  rpc ListSpeaker(ListSpeakerRequest) returns (ListSpeakerResponse) {
    option (google.api.http) = {
      post: "/v1/tts/list_speaker"
      body: "*"
    };
  }
}
service ReportService {
  rpc ReportLLMMsgQuality(ReportLLMMsgQualityRequest) returns (ReportLLMMsgQualityResponse) {
    option (google.api.http) = {
      post: "/v1/report/report_llm_msg_quality"
      body: "*"
    };
  }

  rpc ReportUserEvent(ReportUserEventRequest) returns (ReportUserEventResponse) {
    option (google.api.http) = {
      post: "/v1/report/report_user_event"
      body: "*"
    };
  }

  // 监听事件流
  rpc EventWatch(EventWatchRequest) returns (stream EventWatchResponse) {
    option (google.api.http) = {
      post: "/v1/report/event_watch"
      body: "*"
    };
  }

  // 用户反馈
  rpc UserFeedback(UserFeedbackRequest) returns (UserFeedbackResponse) {
    option (google.api.http) = {
      post: "/v1/report/user_feedback"
      body: "*"
    };
  }
}

service SubscribeService {
  // 创建订阅订单
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/subscribe/create_order"
      body: "*"
    };
  }

  // 获取商品信息列表
  rpc GetProductInfoList(ProductInfoListRequest) returns (ProductInfoListResponse) {
    option (google.api.http) = {
      post: "/v1/subscribe/get_product_info_list"
      body: "*"
    };
  }

  // 用户额度
  rpc GetUserAmount(GetUserAmountRequest) returns (GetUserAmountResponse) {
    option (google.api.http) = {
      post: "/v1/subscribe/get_user_amount"
      body: "*"
    };
  }

  // Genio 用户额度
  rpc GetGenioUserAmount(GetGenioUserAmountRequest) returns (GetGenioUserAmountResponse) {
    option (google.api.http) = {
      post: "/v1/subscribe/get_genio_user_amount"
      body: "*"
    };
  }

  // 订单结果回传
  rpc PaymentResultCallback(PaymentResultCallbackRequest) returns (PaymentResultCallbackResponse) {
    option (google.api.http) = {
      post: "/v1/subscribe/payment_result_callback"
      body: "*"
    };
  }

  // 信用积分明细
  rpc GetCreditDetail(CreditDetailRequest) returns (CreditDetailResponse) {
    option (google.api.http) = {
      post: "/v1/subscribe/get_credit_detail"
      body: "*"
    };
  }

  // 兑换优惠券
  rpc CouponRedeem(CouponRedeemRequest) returns (CouponRedeemResponse) {
