syntax = "proto3";
package va_interface;

import "auth.proto";
import "chat.proto";
import "configuration.proto";
import "media.proto";
import "picture.proto";
import "profile.proto";
import "prompt.proto";
import "report.proto";
import "subscribe.proto";
import "tts.proto";
import "userinfo.proto";
import "google/api/annotations.proto";

option go_package = "va_visionai_server/internal/va_interface";

service SystemService {
  // 获取APP配置项
  rpc GetAppConfiguration(ConfigurationRequest) returns (ConfigurationResponse) {
    option (google.api.http) = {
      post: "/v1/system/get_app_configuration"
      body: "*"
    };
  }
  // 获取用户评分弹窗配置
  rpc GetFeedBackConfig(FeedbackConfigRequest) returns (FeedbackConfigResponse) {
    option (google.api.http) = {
      post: "/v1/system/get_feed_back_config"
      body: "*"
    };
  }
  // 情感状态列表
  rpc GetEmotionalStateList(EmotionalStateListRequest) returns (EmotionalStateListResponse) {
    option (google.api.http) = {
      post: "/v1/system/get_emotional_state_list"
      body: "*"
    };
  }
  // 与档案的情感关系列表
  rpc GetRelationList(RelationListRequest) returns (RelationListResponse) {
    option (google.api.http) = {
      post: "/v1/system/get_relation_list"
      body: "*"
    };
  }
  // 获取固定文案数据
  rpc GetFixedTextData(FixedTextDataRequest) returns (FixedTextDataResponse) {
    option (google.api.http) = {
      post: "/v1/system/get_fixed_text_data"
      body: "*"
    };
  }
  // 获取首页弹窗提醒
  rpc GetPopupNotifications(GetPopupNotificationsRequest) returns (GetPopupNotificationsResponse) {
    option (google.api.http) = {
      post: "/v1/system/get_popup_notifications"
      body: "*"
    };
  }
}
service UserService {
  // 获取用户信息
  rpc GetUserInfo(UserInfoRequest) returns (UserInfoResponse) {
    option (google.api.http) = {
      post: "/v1/user/get_user_info"
      body: "*"
    };
  }

  // 修改用户名
  rpc EditUserName(EditUserNameRequest) returns (EditUserNameResponse) {
    option (google.api.http) = {
      post: "/v1/user/edit_user_name"
      body: "*"
    };
  }

  // 注销账号
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      post: "/v1/user/delete_user"
      body: "*"
    };
  }

  // 用户fcm/apns token上报
  rpc UserNotifyToken(UserNotifyTokenRequest) returns (UserNotifyTokenResponse) {
    option (google.api.http) = {
      post: "/v1/user/notify_token"
      body: "*"
    };
  }

  // 修改用户个人信息
  rpc EditUserInfo(EditUserInfoRequest) returns (EditUserInfoResponse) {
    option (google.api.http) = {
      post: "/v1/user/edit_user_info"
      body: "*"
    };
  }
}

service ProfileService {
  // 创建个人档案
  rpc CreateUserProfile(CreateUserProfileRequest) returns (CreateUserProfileResponse);

  // 编辑个人档案
  rpc EditUserProfile(EditUserProfileRequest) returns (EditUserProfileResponse);

  // 获取个人档案
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);

  // 获取用户自定义个人信息列表
  rpc GetCustomProfileList(GetCustomProfileListRequest) returns (GetCustomProfileListResponse);

  // 创建用户自定义个人信息
  rpc CreateCustomProfile(CreateCustomProfileRequest) returns (CreateCustomProfileResponse);

  // 删除用户自定义个人信息
  rpc DeleteCustomProfile(DeleteCustomProfileRequest) returns (DeleteCustomProfileResponse);

  // 编辑用户自定义个人信息
  rpc EditCustomProfile(EditCustomProfileRequest) returns (EditCustomProfileResponse);
}

service ChatService {
  // 获取用户聊天列表
  rpc GetChatList(ChatListRequest) returns (ChatListResponse) {
    option (google.api.http) = {
      post: "/v1/chat/get_chat_list"
      body: "*"
    };
  }
  // 获取聊天记录详情
  rpc GetChatMessage(ChatMessageListRequest) returns (ChatMessageListResponse) {
    option (google.api.http) = {
      post: "/v1/chat/get_chat_message"
      body: "*"
    };
  }
  // 发送聊天消息，流式接收内容，推荐使用
  rpc SendChatMessageStream(ChatMessageSendRequest) returns (stream ChatMessageStreamResponse) {
    option (google.api.http) = {
      post: "/v1/chat/send_chat_message_stream"
      body: "*"
    };
  }
  // 聊天存档，用户左滑删除
  rpc ChatArchive(ChatArchiveRequest) returns (ChatArchiveResponse) {
    option (google.api.http) = {
      post: "/v1/chat/chat_archive"
      body: "*"
    };
  }
  // 删除聊天记录
  rpc DeleteChatMessage(DeleteChatMessageRequest) returns (DeleteChatMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/delete_chat_message"
      body: "*"
    };
  }
  // 清空服务器端历史记录，本地记录由客户端清理
  rpc ClearChatHistory(ClearChatHistoryRequest) returns (ClearChatHistoryResponse) {
    option (google.api.http) = {
      post: "/v1/chat/clear_chat_history"
      body: "*"
    };
  }
  // 获取所有可用模型
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {
      post: "/v1/chat/list_models"
      body: "*"
    };
  }
  // 用户聊天列表
  rpc ListUserProfileChat(ListUserProfileChatRequest) returns (ListUserProfileChatResponse) {
    option (google.api.http) = {
      post: "/v1/chat/list_user_profile_chat"
      body: "*"
    };
  }
  // 游标获取用户历史消息
  rpc ScrollChatMessage(ScrollChatMessageRequest) returns (ScrollChatMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/scroll_chat_message"
      body: "*"
    };
  }
  // 获取建议问题(支持附加partner_profile_id)
  rpc SuggestQuestionsWithProfile(SuggestQuestionsWithProfileRequest) returns (SuggestQuestionsWithProfileResponse) {
    option (google.api.http) = {
      post: "/v1/chat/suggest_questions_with_profile"
      body: "*"
    };
  }
  // Starlit获取建议问题(支持附加partner_profile_id)
  rpc StarlitQuestionsWithProfile(StarlitQuestionsWithProfileRequest) returns (stream ChatMessageStreamResponse) {
    option (google.api.http) = {
      post: "/v1/chat/starlit_questions_with_profile"
      body: "*"
    };
  }
}
service MediaService {
  // 用户上传图片，也可以上传文件
  rpc UploadImage(UploadRequest) returns (UploadResponse) {
    option (google.api.http) = {
      post: "/v1/media/upload_image"
      body: "*"
    };
  }
  // 系统内部上传
  rpc SysUploadFile(UploadRequest) returns (UploadResponse) {
    option (google.api.http) = {
      post: "/v1/media/sys_upload_file"
      body: "*"
    };
  }
  // upload with opts 暂不使用
  rpc UploadWithOpts(UploadWithOptsRequest) returns (UploadWithOptsResponse) {
    option (google.api.http) = {
      post: "/v1/media/upload_with_opts"
      body: "*"
    };
  }
}
service PromptService {
