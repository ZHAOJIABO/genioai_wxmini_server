syntax = "proto3";
package va_interface;

option go_package = "va_visionai_server/internal/va_interface";

// 支付状态
enum PaymentStatus {
  // 创建订单完成，等待支付成功通知
  PaymentStatusPending = 0;
  // 支付成功
  PaymentStatusSuccess = 1;
  // 支付失败
  PaymentStatusFailed = 2;
  // 取消支付
  PaymentStatusCancel = 3;
}

// 订阅状态
enum SubscribeStatus {
  // 未订阅
  SubscribeNot = 0;
  // 订阅生效中
  SubscribeActivate = 1;
  // 订阅过期
  SubscribeExpired = 2;
}

// 支付方式
enum PaymentWay {
  // 苹果支付
  PaymentApple = 0;
  // 微信支付
  PaymentWayWechat = 1;
  // 支付宝支付
  PaymentWayAlipay = 2;
  // 谷歌支付
  PaymentWayGoogle = 3;
}

enum PublishStatus {
  // 未发布
  PUBLISH_STATUS_UNPUBLISHED = 0;
  // 已发布
  PUBLISH_STATUS_PUBLISHED = 1;
}

enum WorkflowTaskStatus {
  // 未开始
  WORKFLOW_TASK_STATUS_PENDING = 0;
  // 失败
  WORKFLOW_TASK_STATUS_FAILED = 10;
  // 进行中
  WORKFLOW_TASK_STATUS_PROCESSING = 20;

  // 提交外部API失败，等待重试
  WORKFLOW_TASK_STATUS_PENDING_SUBMISSION_RETRY = 30;
  // 已提交外部API，等待其完成
  WORKFLOW_TASK_STATUS_AWAITING_PROVIDER_COMPLETION = 40;

  // 等待链触发
  WORKFLOW_TASK_STATUS_PENDING_CHAIN = 50;

  // 已完成
  WORKFLOW_TASK_STATUS_COMPLETED = 100;
}

enum MessageType {
  // Text Message url字段为空
  MT_TEXT = 0;
  // Image Message url字段为文件地址
  MT_IMAGE = 1;
  // Voice，Message url字段为文件地址
  MT_VOICE = 2;
  // FILE，Message url字段为文件地址
  MT_FILE = 3;
  // VIDEO Message Blob字段为视频数据
  MT_VIDEO = 4;
}

enum FileType {
  // 音频
  FT_AUDIO = 0;
  // 图片
  FT_IMAGE = 1;
  // 视频
  FT_VIDEO = 2;
  // DOC
  FT_DOC = 3;
  // PDF
  FT_PDF = 4;
  // TXT
  FT_TXT = 5;
}

// 用户事件类型
enum UserEventType {
  // Unknown
  USER_EVENT_TYPE_UNKNOWN = 0;
  // 用户查看图片
  USER_EVENT_TYPE_VIEW_PICTURE = 1;
  // 埋点事件
  TRACKING_EVENT = 2;
  // asa归因事件上报
  ATTRIBUTION_EVENT_ASA = 3;
  // asaToken上报
  ATTRIBUTION_EVENT_ASA_TOKEN = 4;
}

// 事件类型枚举
enum WatchEventType {
  // 未知事件类型
  WATCH_EVENT_TYPE_UNKNOWN = 0;
  // 图片任务处理进度事件
  WATCH_EVENT_TYPE_PICTURE_TASK_PROGRESS = 1;
}

enum UploaderRole {
