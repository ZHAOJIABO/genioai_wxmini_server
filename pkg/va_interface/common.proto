enum UserType {
  // 注册用户
  USER_TYPE_REGISTER = 0;
  // 游客
  USER_TYPE_TEMP = 1;
}

// 通用的请求Header
// 支持移动端（App）和Web端
message RequestHeader {
  // ==================== 通用字段 ====================
  // 请求ID
  string req_id = 1;
  // 请求Token（用户登录后携带）
  string access_token = 2;
  // 用户ID
  string user_id = 5;
  // 用户类型 0 注册用户 1 游客
  UserType user_type = 7;
  // 请求时间戳
  int64 request_time_ms = 8;

  // ==================== 移动端专用字段（可选）====================
  // App版本信息（移动端使用）
  optional App app = 3;
  // 设备信息（移动端使用）
  optional Device device = 4;
  // AppStore（移动端使用）
  optional AppStore app_store = 6;

  // ==================== Web端专用字段（可选）====================
  // Web客户端信息（Web端使用）
  optional WebClient web_client = 9;
  // 浏览器信息（Web端使用）
  optional BrowserInfo browser_info = 10;
}

// 通用的响应Header
message ResponseHeader {
  // 请求ID
  string req_id = 1;
  // 错误码 @deprecated
  StatusCode code = 2;
  // 错误信息
  string msg = 3;
  // 服务端时间
  string server_time = 4;
  // 服务端版本
  string server_version = 5;
  // 响应时间
  int64 response_time_ms = 6;
  // 用户ID
  string user_id = 7;
  // 响应状态码
  ResponseStatusCode response_status_code = 8;
}

message Empty {}

message PageCommon {
  // 页码 客户端传入
  int32 page = 1;
  // 页大小 客户端传入
  int32 page_size = 2;
  // 总数 服务端计算返回
  int32 total = 3;
}

// RPC拦截器检查失败时的错误响应
message InterceptorErrorResponse {
  // 响应头，包含错误码和错误信息
  ResponseHeader response_header = 1;
}

message ImageInfo {
  // 图片URL
  string url = 1;
  // 图片像素宽
  int32 width = 2;
  // 图片像素高
  int32 height = 3;
  // 图片低像素尺寸
  string thumbnail_url = 4;
  // 检测到的人脸数量
  int32 face_count = 5;
}

enum ConstellationAnalyzeStatus {
  // 未分析
  CONSTELATION_ANALYZE_STATUS_NOT_ANALYZED = 0;
  // 分析中
  CONSTELATION_ANALYZE_STATUS_ANALYZING = 1;
  // 分析完成
  CONSTELATION_ANALYZE_STATUS_ANALYZED = 2;
}

message Relation {
  // 关系唯一表示
  string relation_iden = 1;
  // 关系文案
  string label = 2;
  // 关系描述
  string description = 3;
  // icon
  string icon = 4;
}

// ==================== 工具相关公共类型 ====================

// 工具参数信息
message ToolParamsInfo {
  string label = 1;
  repeated ToolParamDetail detail = 2;
}

// 工具参数详情
message ToolParamDetail {
  string label = 1;
  string value = 2;
  int32 credit = 3;
}

// 工具能力
message ToolEnhance {
  string title = 1;
  string cover = 2;
  string prompt = 3;
}
